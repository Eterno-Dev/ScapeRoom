<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>El Asesinato Embrujado — Escape Room</title>
  <meta name="description" content="Juego interactivo de escape room y deducción con escáner de pistas físicas." />

  <!-- Google Fonts: Barlow Condensed & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Estilos Modulares (EternoDev Standard) -->
  <link rel="stylesheet" href="src/css/main.css" />
</head>
<body>

  <div class="app-container">

    <!-- ==================================================================
         PANTALLA 1: SELECCIÓN DE PERSONAJE
         ================================================================== -->
    <section id="view-selection" class="view active">
      <header class="header-hero">
        <h1 class="title-spooky">El Asesinato Embrujado</h1>
        <p class="subtitle-hero">Elige personaje</p>
      </header>

      <div class="selection-hint-banner">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        <span>Toca cualquier tarjeta para voltearla y leer su historia</span>
      </div>

      <!-- Cuadrícula de Personajes con Giro 3D -->
      <div class="characters-grid" id="characters-grid">
        <!-- Inyectado dinámicamente con JS -->
      </div>
    </section>

    <!-- ==================================================================
         PANTALLA 2: INTERFAZ EN PARTIDA (1 CARTA EN PANTALLA - SWIPE)
         ================================================================== -->
    <section id="view-game" class="view">
      <!-- Barra superior de partida -->
      <div class="game-top-bar">
        <div class="char-title-group">
          <h2 class="char-active-name" id="game-char-name">Cargando...</h2>
        </div>
        <div class="game-top-actions">
          <button class="btn-top-camera" id="btn-goto-scanner" title="Ir al Escáner QR">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </button>
          <span class="char-locked-badge" id="deck-card-counter">1 / 2</span>
        </div>
      </div>

      <!-- Mazo Deslizable: 1 carta en pantalla a la vez -->
      <div class="game-deck-viewport" id="game-deck-viewport">
        <div class="game-deck-track" id="game-deck-track">
          <!-- Slide 0: Carta del Personaje (Giro 3D) -->
          <!-- Slide 1: Carta del Escáner QR (Giro 3D) -->
          <!-- Slide 2+: Cartas de Pistas Escaneadas (Giro 3D) -->
        </div>
      </div>
    </section>

  </div>

  <!-- ==================================================================
       POP-UP 1: SELECCIÓN DE GÉNERO
       ================================================================== -->
  <div class="modal-overlay" id="gender-modal">
    <div class="modal-box">
      <h2 class="modal-title">Elige tu género</h2>
      <p class="modal-subtitle">Selecciona para adaptar los personajes:</p>

      <div class="gender-options-grid">
        <button class="btn-gender-card" id="btn-choose-male">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="4" r="2.5"></circle>
            <path d="M7 9a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-1.5v6a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-6h-1v6a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-6H8a1 1 0 0 1-1-1V9z"></path>
          </svg>
          <span class="gender-card-label">Hombre</span>
        </button>

        <button class="btn-gender-card" id="btn-choose-female">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="4" r="2.5"></circle>
            <path d="M10 8h4a1 1 0 0 1 1 1l2 7a1 1 0 0 1-1 1h-2v4a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-4H8a1 1 0 0 1-1-1l2-7a1 1 0 0 1 1-1z"></path>
          </svg>
          <span class="gender-card-label">Mujer</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Biblioteca Local Offline jsQR -->
  <script src="src/js/lib/jsqr.js"></script>

  <!-- Lógica Principal Modular (ES Modules) -->
  <script type="module" src="src/js/main.js"></script>
</body>
</html>
