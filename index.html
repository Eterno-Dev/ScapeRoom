<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>El Asesinato Embrujado — Escape Room</title>
  <meta name="description" content="Juego interactivo de escape room y deducción con escáner de pistas físicas." />

  <!-- Google Fonts: Barlow Condensed, Cinzel & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Estilos Modulares (EternoDev Standard) -->
  <link rel="stylesheet" href="src/css/main.css" />
</head>
<body>

  <div class="app-container">

    <!-- ==================================================================
         PANTALLA 1: SELECCIÓN DE PERSONAJE
         ================================================================== -->
    <section id="view-selection" class="view active">
      <header class="header-hero">
        <h1 class="title-spooky">El Asesinato Embrujado</h1>
        <p class="subtitle-hero">Elige personaje</p>
        <div class="header-action-row">
          <button class="btn-debug-nav" id="btn-back-to-gender" title="Volver a seleccionar género">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            Cambiar Género
          </button>
        </div>
      </header>

      <div class="selection-hint-banner">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        <span>Toca cualquier tarjeta para voltearla y leer su historia</span>
      </div>

      <!-- Cuadrícula de Personajes con Giro 3D -->
      <div class="characters-grid" id="characters-grid">
        <!-- Inyectado dinámicamente con JS -->
      </div>
    </section>

    <!-- ==================================================================
         PANTALLA 2: INTERFAZ EN PARTIDA (1 CARTA EN PANTALLA - SWIPE & FLECHAS)
         ================================================================== -->
    <section id="view-game" class="view">
      <!-- Barra superior de partida -->
      <div class="game-top-bar">
        <div class="char-title-group">
          <button class="btn-debug-nav" id="btn-back-to-selection" title="Volver a elegir personaje">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Personajes
          </button>
          <h2 class="char-active-name" id="game-char-name">Cargando...</h2>
        </div>
        <div class="game-top-actions">
          <button class="btn-top-camera" id="btn-goto-scanner" title="Ir al Escáner QR">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </button>
        </div>
      </div>

      <!-- Mazo Deslizable: 1 carta en el centro en todo momento -->
      <div class="game-deck-viewport" id="game-deck-viewport">
        <!-- Flecha Izquierda Flotante con animación -->
        <button class="deck-arrow deck-arrow-left hidden" id="btn-deck-prev" aria-label="Carta anterior">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <div class="game-deck-track" id="game-deck-track">
          <!-- Slide 0: Carta del Personaje (Giro 3D con fondo aleatorio de pergamino) -->
          <!-- Slide 1: Carta del Escáner QR (Giro 3D) -->
          <!-- Slide 2+: Cartas de Pistas Escaneadas (Giro 3D) -->
        </div>

        <!-- Flecha Derecha Flotante con animación -->
        <button class="deck-arrow deck-arrow-right" id="btn-deck-next" aria-label="Siguiente carta">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

      <!-- Contador de cartas debajo del mazo (ej: 1/2, 2/2) -->
      <div class="deck-bottom-bar">
        <span class="deck-card-counter" id="deck-card-counter-bottom">1 / 2</span>
      </div>
    </section>

  </div>

  <!-- ==================================================================
       POP-UP 1: SELECCIÓN DE GÉNERO CON TARJETAS REALES
       ================================================================== -->
  <div class="modal-overlay" id="gender-modal">
    <div class="modal-box">
      <h2 class="modal-title">Elige tu género</h2>
      <p class="modal-subtitle">Selecciona una tarjeta para adaptar los personajes:</p>

      <div class="gender-cards-grid">
        <button class="gender-card-btn" id="btn-choose-male">
          <div class="gender-card-frame">
            <img src="src/assets/images/png/card-gender-male.png" alt="Hombre" class="gender-card-img" />
          </div>
        </button>

        <button class="gender-card-btn" id="btn-choose-female">
          <div class="gender-card-frame">
            <img src="src/assets/images/png/card-gender-female.png" alt="Mujer" class="gender-card-img" />
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- Biblioteca Local Offline jsQR -->
  <script src="src/js/lib/jsqr.js"></script>

  <!-- Lógica Principal Modular (ES Modules) -->
  <script type="module" src="src/js/main.js"></script>
</body>
</html>
